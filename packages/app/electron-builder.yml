appId: app.kikoe.desktop
productName: kikoe
executableName: kikoe
extraMetadata:
  name: kikoe
copyright: Copyright © 2026 builtbywally
directories:
  output: ../../out/app
  buildResources: build
files:
  - dist/**
  - renderer/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: models
    to: models
  - from: build
    to: build
    filter: ["icon.png", "tray.png", "trayTemplate.png", "trayTemplate@2x.png"]
# No asar archive. Electron treats an .asar as a folder, and any Electron app
# that reads into one (Orca did, 2026-09-24) holds the file open until it
# quits; the uninstaller then cannot move it, and every update fails with
# exit code 2, or hangs retrying in silent mode. Plain files are opened and
# closed again, so nothing can pin the install folder. It also means the
# ear's native modules need no unpacking.
asar: false
npmRebuild: false
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: kikoe-${version}-win-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: kikoe listens for "hey Claude" only when you turn the microphone on in settings.
    LSUIElement: true
  artifactName: kikoe-${version}-mac-${arch}.${ext}
linux:
  target: [AppImage]
  category: Development
  artifactName: kikoe-${version}-linux-${arch}.${ext}
